name: gv-rdc-site

services:
  proxy:
    image: caddy:2-alpine
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      app:
        condition: service_healthy

  app:
    build:
      context: ./app
      target: dev
      args:
        DEPLOY_MODE: ${DEPLOY_MODE:-server}
        NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-}
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DEPLOY_MODE: ${DEPLOY_MODE:-server}
      NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-}
      NEXT_PUBLIC_ENABLE_DONATION: ${NEXT_PUBLIC_ENABLE_DONATION:-false}
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    command: sh -c "rm -rf .next && if [ ! -x node_modules/.bin/next ]; then npm install; fi && npm run dev"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - ./app:/app
      - app_node_modules:/app/node_modules
    depends_on:
      admin-init:
        condition: service_completed_successfully

  admin-init:
    build:
      context: ./app
      target: dev
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    command: sh -c "npm run admin:create"
    volumes:
      - ./app:/app
      - app_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/schema/001_public_content.sql:/docker-entrypoint-initdb.d/001_public_content.sql:ro
      - ./db/schema/002_admin_users.sql:/docker-entrypoint-initdb.d/002_admin_users.sql:ro
      - ./db/init/002_seed_public_content.sql:/docker-entrypoint-initdb.d/002_seed_public_content.sql:ro
      - ./db/init/003_seed_media.sql:/docker-entrypoint-initdb.d/003_seed_media.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"

  adminer:
    image: adminer:latest
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  db_data:
  app_node_modules:
